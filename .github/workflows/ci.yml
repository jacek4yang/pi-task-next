name: CI
on:
  pull_request:
  push:

# Least privilege for public fork PRs: workflows only ever read code and
# run tests; no secrets exist in these repositories.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run package-smoke
